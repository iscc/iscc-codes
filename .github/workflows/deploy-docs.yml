name: Deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "maintainers/**"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - "zensical.toml"
      - "scripts/check_site_paths.py"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Check source path compatibility
        run: uv run python scripts/check_site_paths.py
      - name: Build site
        run: uv run zensical build --clean
      - name: Check generated site compatibility
        run: uv run python scripts/check_site_paths.py --site-dir site
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          cname: iscc.codes
