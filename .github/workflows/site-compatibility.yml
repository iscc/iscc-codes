name: Site compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "maintainers/**"
      - "pypi/iscc-wrapper/**"
      - "legacy/python-poc/README.md"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - "zensical.toml"
      - "scripts/check_site_paths.py"
      - ".github/workflows/site-compatibility.yml"

jobs:
  check-site-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Check source path compatibility
        run: uv run python scripts/check_site_paths.py

  build-zensical-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build site
        run: uv run zensical build --clean
      - name: Check generated site compatibility
        run: uv run python scripts/check_site_paths.py --site-dir site
