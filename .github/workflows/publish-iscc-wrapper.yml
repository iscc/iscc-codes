name: Publish iscc wrapper

on:
  pull_request:
    branches:
      - main
    paths:
      - "pypi/iscc-wrapper/**"
      - ".github/workflows/publish-iscc-wrapper.yml"
  push:
    tags:
      - "iscc-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the wrapper to PyPI using PYPI_TOKEN"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pypi/iscc-wrapper
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Check wrapper version matches release tag
        if: startsWith(github.ref, 'refs/tags/iscc-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#iscc-v}"
          PROJECT_VERSION="$(uv version --short)"
          test "$PROJECT_VERSION" = "$TAG_VERSION" || {
            echo "Wrapper version $PROJECT_VERSION does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          }
      - name: Build wrapper package
        run: uv build --out-dir dist --clear
      - name: Check package metadata
        run: uvx --from twine twine check dist/*
      - name: Import smoke test
        run: |
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/iscc_sdk"
          printf 'def code_iscc(path):\n    return path\n' > "$TMP/iscc_sdk/__init__.py"
          PYTHONPATH="src:$TMP" uv run --no-project python - <<'PY'
          import warnings
          with warnings.catch_warnings(record=True) as caught:
              warnings.simplefilter("always")
              import iscc
          assert any("breaking compatibility wrapper" in str(item.message) for item in caught), caught
          assert iscc.code_iscc("demo") == "demo"
          PY
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: iscc-wrapper-dist
          path: pypi/iscc-wrapper/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/iscc-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iscc-wrapper-dist
          path: dist
      - uses: astral-sh/setup-uv@v6
      - name: Publish wrapper to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish dist/*
