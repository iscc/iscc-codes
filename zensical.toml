[project]
site_name = "iscc-codes"
site_description = "International Standard Content Code - Specification"
site_author = "Titusz Pan"
site_url = "https://iscc.codes"
repo_url = "https://github.com/iscc/iscc-codes"
repo_name = "iscc/iscc-codes"
edit_uri = "edit/main/docs/"
copyright = "Documentation licensed under <a href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0</a> | Copyright &copy; 2016-2026 The Authors | <a href=\"https://iscc.foundation/privacy\">Privacy Policy</a> | <a href=\"https://iscc.foundation/cookies\">Cookie Policy</a> | <a href=\"https://iscc.foundation/imprint\">Imprint</a> | <a href=\"https://iscc.foundation/disclaimer\">Disclaimer</a>"
extra_css = ["stylesheets/custom.css"]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/iscc"

[[project.extra.social]]
icon = "fontawesome/brands/telegram"
link = "https://t.me/iscc_dev"

[[project.extra.social]]
icon = "fontawesome/brands/twitter"
link = "https://twitter.com/iscc_foundation"

[project.extra.analytics]
provider = "custom"

nav = [
    { "Overview" = "index.md" },
    { "Features" = "features.md" },
    { "Concept" = "concept.md" },
    { "Specification" = "specification.md" },
    { "Resources" = "resources.md" },
    { "Versions" = [
        { "Version 1.x" = "specification.md" },
        { "Version 1.0" = "https://github.com/iscc/iscc-codes/blob/version-1.0/docs/specification.md" },
    ]},
    { "License" = "license.md" },
]

[project.theme]
language = "en"
custom_dir = "docs/overrides"
logo = "images/logo-black.svg"
favicon = "images/favicon.png"
font = false
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.tooltips",
    "header.autohide",
    "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle = { icon = "lucide/sun", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle = { icon = "lucide/moon", name = "Switch to light mode" }

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
meta = {}
md_in_html = {}

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx]
details = {}
magiclink = {}

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [{ name = "mermaid", class = "mermaid" }]
