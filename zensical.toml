[project]
site_name = "iscc-codes"
site_description = "International Standard Content Code - Specification"
site_author = "Titusz Pan"
site_url = "https://iscc.codes"
repo_url = "https://github.com/iscc/iscc-codes"
repo_name = "iscc/iscc-codes"
edit_uri = "edit/main/docs/"
copyright = "<a href=\"https://iscc.io/foundation\">ISCC Foundation</a> | <a href=\"https://iscc.io/news\">News</a> | Documentation licensed under <a href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0</a> | Copyright &copy; 2016-2026 The Authors | <a href=\"https://iscc.io/privacy\">Privacy Policy</a> | <a href=\"https://iscc.io/cookies\">Cookie Policy</a> | <a href=\"https://iscc.io/imprint\">Imprint</a>"
extra_css = ["stylesheets/custom.css"]

nav = [
    { "iscc-codes" = "index.md" },
    { "Capabilities" = "capabilities.md" },
    { "Concept" = "concept.md" },
    { "Resources" = "resources.md" },
    { "Specification" = "specification.md" },
    { "History" = "history.md" },
    { "License" = "license.md" },
]

# Theme options understood by zensical_iscc/main.html
[project.extra.iscc]
tagline = "International Standard Content Code"
copy_page = true
chat = true

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/iscc"

[[project.extra.social]]
icon = "fontawesome/brands/telegram"
link = "https://t.me/iscc_dev"

[[project.extra.social]]
icon = "fontawesome/brands/twitter"
link = "https://twitter.com/iscc_foundation"

[project.extra.analytics]
provider = "plausible"
domain = "iscc.codes"

# The ISCC theme (fonts, palette, logo, favicon, features, widgets) lives in
# zensical_iscc/ and is shared with other ISCC documentation sites. Keys set
# here override the theme's mkdocs_theme.yml defaults.
[project.theme]
custom_dir = "zensical_iscc"
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.tooltips",
    "header.autohide",
    "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
meta = {}
md_in_html = {}

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx]
details = {}
magiclink = {}

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [{ name = "mermaid", class = "mermaid" }]

# GLightbox image lightbox. With auto = true (default), bare images are wrapped
# in a lightbox anchor; images already inside a link are left untouched.
# width sizes the lightbox overlay to most of the viewport; height stays "auto"
# so wide images scale to the width without being cropped at the sides.
[project.plugins.glightbox]
auto = true
width = "90vw"
