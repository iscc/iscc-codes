[project]
name = "iscc-codes"
version = "0.0.0"
description = "Documentation site and historical material for the International Standard Content Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "zensical==0.0.43",
]

[dependency-groups]
dev = [
  "iscc-sum>=0.1.0",
  "mdformat-mkdocs[recommended]>=4.1.0",
  "prek>=0.2.19",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["pypi/iscc-wrapper"]
